name: Browser USB flasher

on:
  push:
    branches: [main]
    paths: ['web/**', 'tools/meshcore_partition_expansion.py', 'tools/meshcore_backup.py', '.github/workflows/web-flasher.yml']
  pull_request:
    paths: ['web/**', 'tools/meshcore_partition_expansion.py', 'tools/meshcore_backup.py', '.github/workflows/web-flasher.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: read

concurrency:
  group: web-flasher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install pinned dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: web
      - name: Unit and protocol tests
        run: pnpm test
        working-directory: web
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned native compatibility-test dependencies
        run: python3 -m pip install --disable-pip-version-check meshcore==2.3.9.1 meshcore-cli==1.6.3 PyNaCl==1.6.2
      - name: Native archive and migration compatibility
        run: |
          python3 -m unittest discover -s tests -p test_meshcore_backup.py
          python3 -m unittest discover -s tests -p test_meshcore_restore.py
          python3 -m unittest discover -s tests -p test_meshcore_partition_expansion.py
          bash tests/test_mcfirmware_backup_integration.sh
      - name: Refresh public release catalog
        run: node scripts/catalog.mjs
        working-directory: web
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Validate all firmware and utility catalog routes
        run: node scripts/check-catalog.mjs
        working-directory: web
      - name: Build static browser app
        run: pnpm build
        working-directory: web
      - name: Verify public artifact boundaries
        run: node scripts/check-dist.mjs
        working-directory: web
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.event_name != 'pull_request'
        with:
          path: web/dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish static browser flasher
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
