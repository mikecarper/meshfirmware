name: Browser USB flasher

on:
  push:
    branches: [main]
    paths: ['web/**', 'tools/meshcore_partition_expansion*', 'tools/generate_partition_helper_manifest.py', 'tests/test_partition_helper_manifest.py', 'tools/meshcore_backup.py', '.github/workflows/web-flasher.yml']
  pull_request:
    paths: ['web/**', 'tools/meshcore_partition_expansion*', 'tools/generate_partition_helper_manifest.py', 'tests/test_partition_helper_manifest.py', 'tools/meshcore_backup.py', '.github/workflows/web-flasher.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: read

concurrency:
  group: web-flasher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install pinned dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: web
      - name: Unit and protocol tests
        run: pnpm test
        working-directory: web
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pinned native compatibility-test dependencies
        run: python3 -m pip install --disable-pip-version-check meshcore==2.3.9.1 meshcore-cli==1.6.3 PyNaCl==1.6.2
      - name: Native archive and migration compatibility
        run: |
          python3 tools/generate_partition_helper_manifest.py --check
          python3 -m unittest discover -s tests -p test_partition_helper_manifest.py
          python3 -m unittest discover -s tests -p test_meshcore_backup.py
          python3 -m unittest discover -s tests -p test_meshcore_restore.py
          python3 -m unittest discover -s tests -p test_meshcore_partition_expansion.py
          bash tests/test_mcfirmware_backup_integration.sh
      - name: Refresh public release catalog
        run: node scripts/catalog.mjs
        working-directory: web
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Validate all firmware and utility catalog routes
        run: node scripts/check-catalog.mjs
        working-directory: web
      - name: Mirror verified current public firmware for automatic downloads
        run: node scripts/mirror.mjs
        working-directory: web
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build static browser app
        run: pnpm build
        working-directory: web
      - name: Verify public artifact boundaries
        run: node scripts/check-dist.mjs
        working-directory: web
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: web/dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish static browser flasher
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
