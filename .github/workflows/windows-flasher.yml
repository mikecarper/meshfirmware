name: Windows flasher regression tests

on:
  push:
    branches: [main]
    paths: ['firmware.cmd', 'mcfirmware.sh', 'tools/meshcore_partition_expansion*', 'tools/generate_partition_helper_manifest.py', '.gitattributes', 'tests/test_firmware_*.ps1', 'tests/test_mcfirmware_partition*', 'tests/test_mcfirmware_esp32*', 'tests/test_mcfirmware_bluetooth_usb_notice.sh', 'tests/test_partition_helper_manifest.py', 'tests/test_meshcore_partition_expansion.py', '.github/workflows/windows-flasher.yml']
  pull_request:
    paths: ['firmware.cmd', 'mcfirmware.sh', 'tools/meshcore_partition_expansion*', 'tools/generate_partition_helper_manifest.py', '.gitattributes', 'tests/test_firmware_*.ps1', 'tests/test_mcfirmware_partition*', 'tests/test_mcfirmware_esp32*', 'tests/test_mcfirmware_bluetooth_usb_notice.sh', 'tests/test_partition_helper_manifest.py', 'tests/test_meshcore_partition_expansion.py', '.github/workflows/windows-flasher.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Verify generated partition helper contract
        run: python tools/generate_partition_helper_manifest.py --check
      - name: Hardware-free startup, DFU progress, and USB safety checks
        run: |
          $engine = (Get-Process -Id $PID).Path
          foreach ($test in @(
            'tests/test_firmware_esp32_reboot.ps1',
            'tests/test_firmware_nrfutil_progress.ps1',
            'tests/test_firmware_station_recovery.ps1',
            'tests/test_firmware_bluetooth_usb_notice.ps1',
            'tests/test_firmware_esp32_bootloader.ps1',
            'tests/test_firmware_usb_identity.ps1',
            'tests/test_firmware_partition_tool.ps1',
            'tests/test_firmware_partition_expansion.ps1'
          )) {
            & $engine -NoProfile -File $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
  partition-helper-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Verify bundled integrity, future compatibility, and migration flow
        run: |
          python3 tools/generate_partition_helper_manifest.py --check
          python3 -m unittest discover -s tests -p test_partition_helper_manifest.py
          python3 -m unittest discover -s tests -p test_meshcore_partition_expansion.py
          bash tests/test_mcfirmware_partition_tool.sh
          bash tests/test_mcfirmware_partition_expansion.sh
      - name: Hardware-free ESP32 reset and USB reconnect regressions
        run: |
          bash tests/test_mcfirmware_esp32_finish.sh
          bash tests/test_mcfirmware_esp32_s3_finish.sh
          bash tests/test_mcfirmware_esp32_dual_cdc.sh
          bash tests/test_mcfirmware_esp32_post_reset_identity.sh
      - name: Hardware-free Bluetooth completion reminders
        run: bash tests/test_mcfirmware_bluetooth_usb_notice.sh
