name = "meshfirmware-nearby-scopes"
main = "worker.mjs"
compatibility_date = "2026-10-01"

[vars]
# Use only maps your MeshMapper integration key is permitted to read and publish.
MESHMAPPER_MAPS = "pnw"

[[kv_namespaces]]
binding = "SCOPE_SNAPSHOTS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[triggers]
crons = ["17 */2 * * *"]
